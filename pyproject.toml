[project]
name = "cnpj-ingest"
version = "0.1.0"
description = "ETL dos dados abertos de CNPJ da Receita Federal (bronze em Parquet + dbt/DuckDB)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.scripts]
cnpj-ingest = "cnpj_ingest.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "dbt-duckdb>=1.9",
]
publish = [
    "google-cloud-bigquery>=3.25",
]
dash = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnpj_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
